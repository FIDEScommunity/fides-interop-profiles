name: WP Vocabulary Submissions Sync

# Push primary (repository_dispatch from WP publish/delete). HTTP export pull only
# on workflow_dispatch (recovery). See fides-community-tools-tiles §14.1.

on:
  repository_dispatch:
    types: [fides-catalog-export]
  workflow_dispatch:

concurrency:
  group: wp-vocabulary-submissions-sync
  cancel-in-progress: false

jobs:
  sync-wp-vocabulary-submissions:
    if: github.repository == 'FIDEScommunity/fides-interop-profiles'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Import published WordPress vocabulary submissions
        env:
          FIDES_WP_EXPORT_URL: ${{ vars.WP_EXPORT_URL }}
          FIDES_CATALOG_SECRET: ${{ secrets.WP_INVALIDATE_SECRET }}
          FIDES_WP_EXPORT_JSON: ${{ github.event.client_payload.export_json }}
        run: npm run import-wp-vocabulary-submissions:apply

      - name: Rebuild glossary aggregate
        run: npm run build:glossary

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain data/vocabulary.json data/wp-vocabulary-submission-state.json data/glossary-aggregated.json wordpress-plugin/fides-vocabulary-glossary/data/glossary-aggregated.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to commit."
          fi

      - name: Commit WP vocabulary submission updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vocabulary.json data/wp-vocabulary-submission-state.json data/glossary-aggregated.json wordpress-plugin/fides-vocabulary-glossary/data/glossary-aggregated.json
          if git diff --cached --quiet; then
            echo "No staged changes; another run may have committed already."
            exit 0
          fi
          git commit -m "chore: sync WordPress vocabulary submissions [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Notify production WordPress to flush catalog cache
        if: steps.changes.outputs.changed == 'true'
        env:
          WP_INVALIDATE_URL: ${{ vars.WP_INVALIDATE_URL }}
          WP_INVALIDATE_SECRET: ${{ secrets.WP_INVALIDATE_SECRET }}
          CATALOG_TYPE: vocabulary
        run: |
          if [ -z "${WP_INVALIDATE_URL}" ] || [ -z "${WP_INVALIDATE_SECRET}" ]; then
            echo "Skipping: WP_INVALIDATE_URL/SECRET not configured for this repo."
            exit 0
          fi
          echo "Notifying ${WP_INVALIDATE_URL} (type=${CATALOG_TYPE})..."
          curl -fsS -X POST "${WP_INVALIDATE_URL}" \
            -H "User-Agent: FIDES-Catalog-Automation/1.0" \
            -H "X-FIDES-Catalog-Secret: ${WP_INVALIDATE_SECRET}" \
            --data-urlencode "type=${CATALOG_TYPE}" \
            -w '\nHTTP %{http_code}\n' \
            || echo "WP invalidate failed (non-fatal; production has cache TTL fallback)"
